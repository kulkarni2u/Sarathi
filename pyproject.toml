[project]
name = "sarathi-ai"
version = "0.3.0"
description = "Policy-backed AI delivery cockpit with shared service, CLI, TUI, WebUI, desktop, and agent integrations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sarathi contributors" }]
dependencies = [
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
    "neural-context-protocol>=1.1.0,<2.0.0",
]

[project.scripts]
sarathi = "src.cli:main"
sarathi-desktop = "src.service.desktop:main"
sarathi-mcp = "src.mcp_server:main"
sarathi-slack = "src.service.slack.socket_mode:main"

[project.urls]
Homepage = "https://github.com/kulkarni2u/Sarathi"

[project.optional-dependencies]
slack = ["slack-sdk>=3,<4"]
tui = [
    "textual>=0.90.0",
    "rich>=13.0.0",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "black",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"share/sarathi/ncp" = [
    "docs/ncp/config.toml.example",
    "docs/ncp/run.py.example",
]
"share/sarathi/skill" = [
    "skill/SKILL.md",
    "skill/sarathi-implementer-prompt.md",
    "skill/sarathi-init.md",
]
"share/sarathi/skill/hooks" = [
    "skill/hooks/hooks.json",
    "skill/hooks/hooks-cursor.json",
    "skill/hooks/run-hook.cmd",
    "skill/hooks/session-start",
]
"share/sarathi/skill/.opencode/plugins" = [
    "skill/.opencode/plugins/sarathi.js",
]
"share/sarathi/skill/reference" = [
    "skill/reference/config.md",
    "skill/reference/required-list.md",
    "skill/reference/workflow.md",
]
"share/sarathi/skill/policy-pack/EXAMPLE" = [
    "skill/policy-pack/EXAMPLE/commands.md",
    "skill/policy-pack/EXAMPLE/complexity.md",
    "skill/policy-pack/EXAMPLE/conventions.md",
    "skill/policy-pack/EXAMPLE/escalation.md",
    "skill/policy-pack/EXAMPLE/model-routing.md",
    "skill/policy-pack/EXAMPLE/review.md",
    "skill/policy-pack/EXAMPLE/skills.md",
    "skill/policy-pack/EXAMPLE/task-tracking.md",
    "skill/policy-pack/EXAMPLE/workflow-patterns.md",
]
"share/sarathi/skill/policy-pack/TEMPLATE" = [
    "skill/policy-pack/TEMPLATE/commands.md",
    "skill/policy-pack/TEMPLATE/complexity.md",
    "skill/policy-pack/TEMPLATE/conventions.md",
    "skill/policy-pack/TEMPLATE/escalation.md",
    "skill/policy-pack/TEMPLATE/model-routing.md",
    "skill/policy-pack/TEMPLATE/permissions.md",
    "skill/policy-pack/TEMPLATE/review.md",
    "skill/policy-pack/TEMPLATE/skills.md",
    "skill/policy-pack/TEMPLATE/task-tracking.md",
    "skill/policy-pack/TEMPLATE/workflow-patterns.md",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
# Many modules under src/ use a dual-import fallback pattern
# (`try: from .foo import X` / `except ImportError: from foo import X`) to
# support running as scripts / from within a `src/` cwd without the package
# installed (see e.g. src/harness.py, src/runtime/recovery.py,
# src/phases/learn.py). Because a stray root-level `__init__.py` also
# exists, mypy's default module-path inference sees the same file reachable
# both as "src.<module>" and as "<repo-dir-name>.src.<module>", which it
# reports as "Source file found twice under different module names".
# Anchoring module resolution at the repo root (mypy_path) and using
# explicit_package_bases resolves that ambiguity without touching the
# dual-import pattern itself, and without renaming the (intentionally
# named) "src" package that project.scripts entry points depend on.
mypy_path = "."
explicit_package_bases = true

# The bare `except ImportError: import <name>` fallback branches above are
# never resolvable as real top-level packages once "src" is correctly
# anchored as the package root above (they only work at runtime via the
# sys.path tricks those modules perform when executed directly). Without
# these overrides, mypy cascades into a "Cannot find implementation or
# library stub for module named ..." error for every one of those fallback
# imports. This is the same root-cause ambiguity as above, just surfacing
# per-file instead of as a single structural error, so it is suppressed
# here rather than by editing ~30 files to drop the fallback pattern.
[[tool.mypy.overrides]]
module = [
    "agent_roles",
    "base",
    "cli",
    "dispatch",
    "evolve",
    "harness",
    "init",
    "permissions",
    "phases",
    "policy",
    "repo_wiki",
    "sandbox",
    "task_class",
    "task_graph",
    "trust_gate",
    "tui",
    "tui_data",
    "validate",
    "workspace_evidence",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["runtime.*", "ncp_adapter.*", "policy.*", "service.*"]
ignore_missing_imports = true
