      Runtime config contract (see src/service/desktop.py):
      The desktop launcher writes a script that sets
      window.__SARATHI_RUNTIME_CONFIG__ = { baseUrl, token } before the app

      falls back to import.meta.env / http://127.0.0.1:8765 in that case.
    -->
    <script src="/sarathi-runtime.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
